<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create account — Inkwell</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head><body data-page="register"><header class="navbar"><div class="container nav-inner"><a class="brand" href="index.html"><span class="brand-mark">i</span> inkwell<span style="color:var(--blue)">.</span></a><a class="btn btn-outline" href="index.html">← Home</a></div></header><main class="container auth-layout"><section class="panel auth-card"><span class="eyebrow">JOIN THE COMMUNITY</span><h1 style="margin-top:15px">Make yourself at home.</h1><p>Create an account and start sharing your story.</p><form id="registerForm"><div class="form-group"><label for="name">Your name</label><input class="field" id="name" name="name" type="text" placeholder="e.g. Bouyashree" required minlength="2" autocomplete="name"></div><div class="form-group"><label for="email">Email address</label><input class="field" id="email" name="email" type="email" placeholder="you@example.com" required autocomplete="email"></div><div class="form-group"><label for="password">Create password</label><input class="field" id="password" name="password" type="password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password"></div><div class="form-group"><label for="confirmPassword">Confirm password</label><input class="field" id="confirmPassword" name="confirmPassword" type="password" placeholder="Enter password again" required autocomplete="new-password"></div><div id="formMessage" aria-live="polite"></div><button class="btn btn-primary" type="submit">Create account ↗</button></form><p class="form-note">Already have an account? <a href="login.html" style="color:var(--blue);font-weight:800">Log in</a></p><p class="form-note">Learning demo only: passwords are stored in browser localStorage. Do not use a real password here.</p></section></main><footer class="footer"><div class="container footer-inner"><span>© 2026 inkwell.</span><span>Make space for ideas.</span></div></footer></body></html>
