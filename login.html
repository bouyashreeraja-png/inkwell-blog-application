<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Log in — Inkwell</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head><body data-page="login"><header class="navbar"><div class="container nav-inner"><a class="brand" href="index.html"><span class="brand-mark">i</span> inkwell<span style="color:var(--blue)">.</span></a><a class="btn btn-outline" href="index.html">← Home</a></div></header><main class="container auth-layout"><section class="panel auth-card"><span class="eyebrow">WELCOME BACK</span><h1 style="margin-top:15px">Good to see you.</h1><p>Log in to keep your ideas moving.</p><form id="loginForm"><div class="form-group"><label for="email">Email address</label><input class="field" id="email" name="email" type="email" placeholder="you@example.com" required autocomplete="email"></div><div class="form-group"><label for="password">Password</label><input class="field" id="password" name="password" type="password" placeholder="Enter your password" required autocomplete="current-password"></div><div id="formMessage" aria-live="polite"></div><button class="btn btn-primary" type="submit">Log in ↗</button></form><p class="form-note">New to inkwell? <a href="register.html" style="color:var(--blue);font-weight:800">Create an account</a></p><p class="form-note">Demo note: account details are stored only in this browser for this learning project.</p></section></main><footer class="footer"><div class="container footer-inner"><span>© 2026 inkwell.</span><span>Make space for ideas.</span></div></footer></body></html>
